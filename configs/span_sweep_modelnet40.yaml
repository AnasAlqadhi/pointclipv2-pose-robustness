# Does the ensemble's benefit depend on the span? Prediction recorded in
# scripts/run_span_sweep.py: spans of 90 and 360 are near no-ops because the
# view set is closed under a 90 degree turn; small spans help, most at a trough.
name: span_sweep_modelnet40
dataset: modelnet40
data_root: data/modelnet40_ply_hdf5_2048
split: test
backbone: ViT-B/16
protocol: published
num_points: 1024
batch_size: 16
seed: 0
ensemble_k: 4
angles: [0, 30]
spans: [11.25, 22.5, 45, 90, 360]
